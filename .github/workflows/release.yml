name: Build release installers

# Publishing is explicit: verified installers are uploaded once, then their
# checksums are pinned in Homebrew. CI never replaces published release assets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri -- build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Requin-${{ inputs.tag }}-${{ matrix.arch }}
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
